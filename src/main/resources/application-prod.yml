server:
  port: 8082

spring:
  application:
    name: domain-service-sigepac
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://db-spring-jwt.cpq0kiice2iw.us-east-2.rds.amazonaws.com:3306/sigepac_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:admin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin123}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SigepacHikariPool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      hibernate.jdbc.time_zone: America/Bogota

